name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:                       # the branch rule on main requires this check
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  secrets-scan:
    name: secrets-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # scan every commit, not only the last one
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --build-arg GIT_SHA=${{ github.sha }} -t loan-service:ci .
      - name: No secrets in the image
        run: |
          # API_KEY must only exist at run time (Render env var), never in the image
          if docker run --rm loan-service:ci env | grep -q '^API_KEY='; then echo "API_KEY is baked into the image"; exit 1; fi
          if docker run --rm loan-service:ci sh -c 'ls -a /app' | grep -E '^\.env'; then echo ".env file in image"; exit 1; fi
          docker history --no-trunc loan-service:ci | grep -iE 'api_key=|password=|secret=' && exit 1 || true
          echo "image is clean"
      - name: Runs as non-root
        run: test "$(docker run --rm loan-service:ci whoami)" = "app"
